    <style>
        body {
            font-family: 'Hind Siliguri', 'Poppins', sans-serif;
            background: radial-gradient(circle at center, #111c16 0%, #080c09 100%);
            color: #ffffff;
            user-select: none;
        }

        /* Gold metallic text glow */
        .gold-glow {
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.6), 0 0 20px rgba(255, 215, 0, 0.3);
        }

        /* 3D Roulette Wheel Container Frame */
        .roulette-wrapper {
            position: relative;
            width: 320px;
            height: 320px;
            background: radial-gradient(circle, #3d220a 0%, #170d03 100%);
            border-radius: 50%;
            padding: 12px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9),
                        inset 0 2px 6px rgba(255, 255, 255, 0.4),
                        inset 0 -8px 20px rgba(0, 0, 0, 0.9);
            border: 4px solid #b8860b;
        }

        .outer-rim {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #b8860b, #ffd700, #b8860b, #ffd700, #b8860b);
            padding: 6px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
        }

        /* Smooth rotating canvas */
        #rouletteWheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.9);
            transition: transform 6s cubic-bezier(0.08, 0.85, 0.12, 1);
        }

        /* Metallic Center Cap */
        .center-cap {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 64px;
            height: 64px;
            background: radial-gradient(circle, #ffffff 0%, #ffd700 40%, #b8860b 100%);
            border-radius: 50%;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.8), inset 0 2px 4px rgba(255, 255, 255, 0.9);
            z-index: 5;
            border: 2px solid #5c4308;
        }

        /* Top Ball Marker Pointer */
        .ball-marker {
            position: absolute;
            top: 2px;
            left: 50%;
            transform: translateX(-50%);
            width: 18px;
            height: 18px;
            background: radial-gradient(circle at 30% 30%, #ffffff, #888888);
            border-radius: 50%;
            z-index: 20;
            box-shadow: 0 4px 10px rgba(0,0,0,0.9), 0 0 12px rgba(255, 255, 255, 1);
        }

        /* Felt Casino Betting Table */
        .felt-table {
            background: radial-gradient(circle at center, #0e5230 0%, #07331d 100%);
            border: 3px solid #d4af37;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.6), 0 15px 35px rgba(0,0,0,0.7);
        }

        /* Casino Poker Chips Style */
        .chip {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 0.85rem;
            cursor: pointer;
            border: 4px dashed rgba(255, 255, 255, 0.7);
            box-shadow: 0 6px 12px rgba(0,0,0,0.6), inset 0 2px 4px rgba(255,255,255,0.8);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .chip:hover {
            transform: translateY(-4px) scale(1.08);
            box-shadow: 0 10px 20px rgba(0,0,0,0.8);
        }

        .chip.selected {
            transform: translateY(-6px) scale(1.15);
            border-color: #ffd700;
            box-shadow: 0 0 18px #ffd700, inset 0 2px 4px #ffffff;

        /* Bet Options Grid Items */
        .bet-btn {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(212, 175, 55, 0.4);
            transition: all 0.2s ease;
            font-weight: 700;
            position: relative;
        }

        .bet-btn:hover {
            background: rgba(212, 175, 55, 0.2);
            border-color: #ffd700;
        }

        .bet-badge {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #ffd700;
            color: #000;

            font-weight: 800;
            padding: 2px 6px;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.5);

        /* Win Glow Animation */
        @keyframes glowPulse {
            0% { box-shadow: 0 0 10px #22c55e; }
            50% { box-shadow: 0 0 30px #22c55e; }
            100% { box-shadow: 0 0 10px #22c55e; }
        }

        .win-glow {
            animation: glowPulse 1.2s infinite;
        }
    </style>
</head>

    <!-- GAME LOGIC SCRIPT -->
    <script>
        // State Variables
        let walletBalance = 1000;
        let selectedChip = 10;
        let bets = {}; // Stores bet key and amount e.g. { RED: 50, "NUM_17": 10 }
        let currentRotation = 0;
        let isSpinning = false;

        // European Roulette Sequence
        const numbers = [0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10, 5, 24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7, 28, 12, 35, 3, 26];
        const redNumbers = [32, 19, 21, 25, 34, 27, 36, 30, 23, 5, 16, 1, 14, 9, 18, 7, 12, 3];
        const totalSectors = numbers.length;
        const arc = (2 * Math.PI) / totalSectors;

        // Elements
        const canvas = document.getElementById('rouletteWheel');
        const ctx = canvas.getContext('2d');
        const spinBtn = document.getElementById('spinBtn');
        const balanceText = document.getElementById('balanceText');
        const totalBetText = document.getElementById('totalBetText');
        const statusTitle = document.getElementById('statusTitle');
        const statusDesc = document.getElementById('statusDesc');
        const resultBox = document.getElementById('resultBox');
        const landedNum = document.getElementById('landedNum');

        // --- WEB AUDIO API SOUND SYNTHESIZER ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            if (type === 'chip') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.05);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            } else if (type === 'tick') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(500, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.03);
            } else if (type === 'win') {
                const now = audioCtx.currentTime;
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                    const noteOsc = audioCtx.createOscillator();
                    const noteGain = audioCtx.createGain();
                    noteOsc.type = 'sine';
                    noteOsc.frequency.setValueAtTime(freq, now + idx * 0.1);
                    noteGain.gain.setValueAtTime(0.1, now + idx * 0.1);
                    noteGain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.1 + 0.3);
                    noteOsc.connect(noteGain);
                    noteGain.connect(audioCtx.destination);
                    noteOsc.start(now + idx * 0.1);
                    noteOsc.stop(now + idx * 0.1 + 0.3);
                });
            } else if (type === 'lose') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        // --- DRAW 3D WHEEL ---
        function drawWheel() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = canvas.width / 2 - 10;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < totalSectors; i++) {
                const angle = i * arc - Math.PI / 2;
                const num = numbers[i];

                if (num === 0) {
                    ctx.fillStyle = "#00873e"; // Green
                } else if (redNumbers.includes(num)) {
                    ctx.fillStyle = "#dc2626"; // Red
                } else {
                    ctx.fillStyle = "#18181b"; // Black
                }

                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, angle, angle + arc);
                ctx.lineTo(centerX, centerY);
                ctx.fill();

                // Separators
                ctx.strokeStyle = "#ffd700";
                ctx.lineWidth = 1;
                ctx.stroke();

                // Numbers
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(angle + arc / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 18px Poppins";
                ctx.fillText(num, radius - 15, 6);
                ctx.restore();
            }

            // Inner Ring
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius - 60, 0, 2 * Math.PI);
            ctx.fillStyle = "#09090b";
            ctx.fill();
            ctx.strokeStyle = "#b8860b";
            ctx.lineWidth = 4;
            ctx.stroke();
        }

        drawWheel();

        // --- BETTING CONTROLS ---
        function selectChip(amount) {
            selectedChip = amount;
            document.querySelectorAll('.chip').forEach(el => el.classList.remove('selected'));
            document.getElementById(`chip-${amount}`).classList.add('selected');
            playSound('chip');
        }

        function calculateTotalBet() {
            return Object.values(bets).reduce((sum, val) => sum + val, 0);
        }

        function updateUI() {
            balanceText.innerText = `$${walletBalance.toLocaleString()}`;
            const totalBet = calculateTotalBet();
            totalBetText.innerText = `$${totalBet.toLocaleString()}`;

            // Update Badges
            document.querySelectorAll('.bet-badge').forEach(el => el.classList.add('hidden'));
            
            let specHtml = "";
            for (let key in bets) {
                const badge = document.getElementById(`badge-${key}`);
                if (badge) {
                    badge.innerText = `$${bets[key]}`;
                    badge.classList.remove('hidden');
                } else if (key.startsWith('NUM_')) {
                    const numVal = key.replace('NUM_', '');
                    specHtml += `<span class="bg-amber-400 text-black text-xs font-bold px-2.5 py-1 rounded-lg border border-amber-300">
                        নম্বর ${numVal}: $${bets[key]}
                    </span>`;
                }
            }
            document.getElementById('specificBetsContainer').innerHTML = specHtml;
        }

        function placeBet(key) {
            if (isSpinning) return;

            if (walletBalance < selectedChip) {
                alert("আপনার ওয়ালেটে পর্যাপ্ত ব্যালেন্স নেই!");
                return;
            }

            walletBalance -= selectedChip;
            bets[key] = (bets[key] || 0) + selectedChip;
            playSound('chip');
            updateUI();
        }

        function placeSpecificBet() {
            const input = document.getElementById('specificNumInput');
            const val = parseInt(input.value);

            if (isNaN(val) || val < 0 || val > 36) {
                alert("০ থেকে ৩৬ এর মধ্যে সঠিক নম্বর দিন!");
                return;
            }

            placeBet(`NUM_${val}`);
            input.value = "";
        }

        function clearBets() {
            if (isSpinning) return;
            const total = calculateTotalBet();
            walletBalance += total;
            bets = {};
            playSound('chip');
            updateUI();
        }

        // --- SPIN & WIN ENGINE ---
        function spin() {
            const totalBet = calculateTotalBet();
            if (totalBet === 0) {
                alert("অনুগ্রহ করে অন্তত একটি বাজি ধরুন!");
                return;
            }

            if (isSpinning) return;

            isSpinning = true;
            spinBtn.disabled = true;
            statusTitle.innerText = "ঘুরছে...";
            statusTitle.className = "text-2xl font-bold text-amber-300";
            statusDesc.innerText = "ভাগ্য পরীক্ষার জন্য অপেক্ষা করুন...";
            resultBox.classList.add('hidden');

            // Random landed angle
            const randomSector = Math.floor(Math.random() * totalSectors);
            const extraDegrees = (360 * 7) + (randomSector * (360 / totalSectors));
            currentRotation += extraDegrees;

            canvas.style.transform = `rotate(${currentRotation}deg)`;

            // Sound simulation during rotation
            let tickInterval = setInterval(() => {
                playSound('tick');
            }, 120);

            setTimeout(() => {
                clearInterval(tickInterval);
                isSpinning = false;
                spinBtn.disabled = false;

                // Calculate winning number
                const actualDegrees = currentRotation % 360;
                const winningIndex = Math.floor((360 - (actualDegrees % 360)) / (360 / totalSectors)) % totalSectors;
                const winner = numbers[winningIndex];

                evaluateWin(winner);
            }, 6000);
        }

        function evaluateWin(winner) {
            let totalWin = 0;
            const isRed = redNumbers.includes(winner);
            const isEven = winner !== 0 && winner % 2 === 0;
            const isOdd = winner !== 0 && winner % 2 !== 0;

            for (let key in bets) {
                const betAmt = bets[key];

                if (key === 'RED' && isRed) totalWin += betAmt * 2;
                if (key === 'BLACK' && !isRed && winner !== 0) totalWin += betAmt * 2;
                if (key === 'EVEN' && isEven) totalWin += betAmt * 2;
                if (key === 'ODD' && isOdd) totalWin += betAmt * 2;

                if (key === '1ST_DOZEN' && winner >= 1 && winner <= 12) totalWin += betAmt * 3;
                if (key === '2ND_DOZEN' && winner >= 13 && winner <= 24) totalWin += betAmt * 3;
                if (key === '3RD_DOZEN' && winner >= 25 && winner <= 36) totalWin += betAmt * 3;

                if (key === `NUM_${winner}`) totalWin += betAmt * 36;
            }

            // Display Landed Number
            landedNum.innerText = winner;
            if (winner === 0) {
                landedNum.className = "inline-flex items-center justify-center w-16 h-16 rounded-2xl text-2xl font-extrabold bg-emerald-600 text-white shadow-lg border-2 border-amber-300";
            } else if (isRed) {
                landedNum.className = "inline-flex items-center justify-center w-16 h-16 rounded-2xl text-2xl font-extrabold bg-rose-600 text-white shadow-lg border-2 border-amber-300";
            } else {
                landedNum.className = "inline-flex items-center justify-center w-16 h-16 rounded-2xl text-2xl font-extrabold bg-stone-900 text-white shadow-lg border-2 border-amber-300";
            }
            resultBox.classList.remove('hidden');

            if (totalWin > 0) {
                walletBalance += totalWin;
                statusTitle.innerText = `YOU WIN $${totalWin.toLocaleString()}! 🎉`;
                statusTitle.className = "text-2xl font-extrabold text-emerald-400 gold-glow";
                statusDesc.innerText = `অভিনন্দন! আপনার বাজি সফল হয়েছে।`;
                playSound('win');

                // Confetti animation
                confetti({
                    particleCount: 80,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            } else {
                statusTitle.innerText = "BET LOST 😞";
                statusTitle.className = "text-2xl font-bold text-rose-500";
                statusDesc.innerText = "দুঃখিত, কোনো বাজি মেলেনি। আবার চেষ্টা করুন!";
                playSound('lose');
            }

            // Reset bets after evaluation
            bets = {};
            updateUI();
        }

        // Initialize UI
        updateUI();
    </script>
